name: Quality Gate

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "سبب إعادة التحقق (مثلاً: تعافٍ بعد عطل خدمة أو طلب مراجع)"
        required: true
        type: choice
        options:
          - recovery_after_provider_incident
          - reviewer_requested_recheck
          - rerun_after_non_code_infrastructure_failure
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  manual-run-guard:
    name: Manual run guard
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Reject direct manual validation on main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "::error::Manual Quality Gate runs must target a pull-request branch, not main."
          exit 1
      - name: Record the requested reason
        run: |
          echo "Manual Quality Gate reason: ${{ inputs.reason }}"

  validate:
    name: Typecheck, test, build, and production audit
    needs: manual-run-guard
    if: always() && (needs.manual-run-guard.result == 'success' || needs.manual-run-guard.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm check
      - name: Run tests
        run: pnpm test
      - name: Build production bundle
        run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
